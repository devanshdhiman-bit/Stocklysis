<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockLysis - Login</title>
  <link rel="stylesheet" href="common.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">📊 StockLysis</div>
    <div class="auth-subtitle">Login to your account</div>

    <form id="loginForm">
      <input id="email"    type="email"    placeholder="Email Address" required/>
      <input id="password" type="password" placeholder="Password"      required/>
      <div class="auth-options">
        <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" style="width:auto;margin:0;"/> Remember me</label>
        <a href="#">Forgot Password?</a>
      </div>
      <button type="submit" class="btn-primary" style="margin-top:8px;">🔑 Login</button>
    </form>

    <div class="auth-link">Don't have an account? <a href="signin.html">Sign Up</a></div>
    <div style="text-align:center; margin-top:10px;">
      <a href="index.html" class="btn-back">← Back to Home</a>
    </div>
  </div>
</div>

<script>

// If already logged in, go straight to dashboard
if(localStorage.getItem('loggedInUser')) window.location.href = 'dashboard.html';

document.getElementById('loginForm').addEventListener('submit', function(e){
  e.preventDefault();
  const email    = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const users    = JSON.parse(localStorage.getItem('users')) || [];
  const found    = users.find(u => u.email === email && u.password === password);
  if(!found){ alert('Invalid email or password.'); return; }
  localStorage.setItem('loggedInUser', JSON.stringify(found));
  window.location.href = 'dashboard.html';
});
</script>
<script src="common.js"></script>
</body>
</html>
